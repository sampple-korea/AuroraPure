name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Enforce the download-only source boundary
        run: |
          if git grep -n -E 'REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|PackageInstaller|WorkManager|UpdateWorker|Shizuku|RootInstaller' -- pure; then
            echo "Download-only boundary violation detected"
            exit 1
          fi

      - name: Test, lint, and build release
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :pure:testDebugUnitTest :pure:lintDebug :pure:assembleRelease
