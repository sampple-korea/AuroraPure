name: Aurora Pure CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Enforce the download-only source boundary
        run: |
          if git grep -n -E 'REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|PackageInstaller|WorkManager|UpdateWorker|Shizuku|RootInstaller' -- pure; then
            echo "Download-only boundary violation detected"
            exit 1
          fi

      - name: Test, lint, and build Android and CLI releases
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :pure:testDebugUnitTest :pure:lintDebug :pure:assembleRelease
          :cli:test :cli:distZip :cli:distTar

      - name: Inspect merged release permissions
        shell: bash
        run: |
          set -euo pipefail
          release_apk=$(find pure/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$release_apk"
          permissions=$(aapt2 dump permissions "$release_apk")
          printf '%s\n' "$permissions"
          grep -q "android.permission.INTERNET" <<<"$permissions"
          grep -q "android.permission.ACCESS_NETWORK_STATE" <<<"$permissions"
          for forbidden in \
            REQUEST_INSTALL_PACKAGES REQUEST_DELETE_PACKAGES QUERY_ALL_PACKAGES \
            MANAGE_EXTERNAL_STORAGE REQUEST_IGNORE_BATTERY_OPTIMIZATIONS \
            UPDATE_PACKAGES_WITHOUT_USER_ACTION ENFORCE_UPDATE_OWNERSHIP \
            FOREGROUND_SERVICE POST_NOTIFICATIONS; do
            if grep -q "$forbidden" <<<"$permissions"; then
              echo "Forbidden merged permission: $forbidden"
              exit 1
            fi
          done

      - name: Upload Android build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurora-pure-android
          path: pure/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload CLI builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurora-pure-cli
          path: |
            cli/build/distributions/*.zip
            cli/build/distributions/*.tar
          if-no-files-found: error
